<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dire Dawa Ras Hotel — Staff Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --maroon: #8B2323;
    --maroon-dark: #6b1a1a;
    --gold: #D4A017;
    --gold-hover: #E5B12A;
    --ink: #2a1f1f;
    --paper: #faf6f0;
    --panel: #ffffff;
    --line: #ece3d6;
    --muted: #7a6f65;
    --new-bg: #fbeee0;
    --new-txt: #9a5b0f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .brandbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: var(--maroon);
    color: #fff;
  }
  .brandbar h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0;
  }
  .brandbar .tag {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 4px 10px;
    border-radius: 20px;
  }

  #gate {
    max-width: 360px;
    margin: 14vh auto 0;
    padding: 40px 34px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    border-radius: 4px;
    text-align: center;
  }
  #gate h2 { font-family: Georgia, serif; font-size: 20px; margin: 0 0 6px; color: var(--maroon-dark); }
  #gate p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  #gate input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 3px; font-size: 14px; margin-bottom: 12px;
  }
  #gate button, .refresh {
    padding: 11px 16px; background: var(--maroon); color: #fff; border: none;
    border-radius: 3px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  #gate button { width: 100%; }
  #gate button:hover, .refresh:hover { background: var(--maroon-dark); }
  #gateError { color: #a13d3d; font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  #portal { display: none; max-width: 1100px; margin: 0 auto; padding: 28px 32px 60px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 2px solid var(--line); }
  .tab {
    padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--maroon); border-bottom-color: var(--gold); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  .toolbar input[type="text"] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; width: 240px; }
  .refresh { width: auto; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; background: #f7f0e6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fdf9f2; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--new-bg); color: var(--new-txt); }
  .ref { font-family: monospace; font-weight: 700; color: var(--maroon); }
  #empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

  <div class="brandbar">
    <h1><i class="fas fa-hotel"></i>&nbsp; Dire Dawa Ras Hotel</h1>
    <span class="tag">Staff Portal</span>
  </div>

  <div id="gate">
    <h2>Staff Access</h2>
    <p>Enter the access code to view bookings and messages.</p>
    <input type="password" id="passwordInput" placeholder="Access code">
    <button onclick="login()">Enter Portal</button>
    <div id="gateError"></div>
  </div>

  <div id="portal">
    <div class="tabs">
      <div class="tab active" id="tabBookingsBtn" onclick="switchTab('bookings')">Room Bookings</div>
      <div class="tab" id="tabMessagesBtn" onclick="switchTab('messages')">Contact Messages</div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search by name or email..." oninput="renderCurrent()">
      <button class="refresh" onclick="loadData()"><i class="fas fa-rotate"></i> Refresh</button>
    </div>

    <div class="view active" id="bookingsView">
      <table>
        <thead>
          <tr>
            <th>Status</th><th>Reference</th><th>Guest</th><th>Contact</th>
            <th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Total</th><th>Requests</th><th>Received</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
    </div>

    <div class="view" id="messagesView">
      <table>
        <thead>
          <tr><th>Status</th><th>Name</th><th>Contact</th><th>Subject</th><th>Message</th><th>Received</th></tr>
        </thead>
        <tbody id="messagesBody"></tbody>
      </table>
    </div>

    <div id="empty" style="display:none;">Nothing here yet.</div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAEQ3j7aLybqkNTHVXraB2-2DjEAxJOd_2Nsgfvvr9MduxO19eK8J9Kia1IJ6r95vOpQ/exec";

  let accessKey = "";
  let allBookings = [];
  let allMessages = [];
  let currentTab = "bookings";

  function login() {
    const pw = document.getElementById("passwordInput").value.trim();
    if (!pw) return;
    accessKey = pw;
    loadData(true);
  }

  function loadData(isLogin) {
    document.getElementById("gateError").textContent = "";
    fetch(SCRIPT_URL + "?key=" + encodeURIComponent(accessKey))
      .then(r => r.json())
      .then(data => {
        if (data.result !== "success") {
          if (isLogin) document.getElementById("gateError").textContent = "Incorrect access code.";
          return;
        }
        allBookings = data.bookings || [];
        allMessages = data.messages || [];
        document.getElementById("gate").style.display = "none";
        document.getElementById("portal").style.display = "block";
        renderCurrent();
      })
      .catch(() => {
        document.getElementById("gateError").textContent = "Could not connect. Try again.";
      });
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabBookingsBtn").classList.toggle("active", tab === "bookings");
    document.getElementById("tabMessagesBtn").classList.toggle("active", tab === "messages");
    document.getElementById("bookingsView").classList.toggle("active", tab === "bookings");
    document.getElementById("messagesView").classList.toggle("active", tab === "messages");
    renderCurrent();
  }

  function renderCurrent() {
    const query = document.getElementById("searchBox").value.toLowerCase();

    if (currentTab === "bookings") {
      const filtered = allBookings.filter(b =>
        ((b["First Name"] || "") + " " + (b["Last Name"] || "")).toLowerCase().includes(query) ||
        (b["Email"] || "").toLowerCase().includes(query)
      );
      const body = document.getElementById("bookingsBody");
      body.innerHTML = "";
      document.getElementById("empty").style.display = filtered.length ? "none" : "block";
      filtered.forEach(b => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><span class='badge'>New</span></td>" +
          "<td class='ref'>" + (b["Reference"] || "") + "</td>" +
          "<td>" + (b["First Name"] || "") + " " + (b["Last Name"] || "") + "<br><span style='color:#7a6f65'>" + (b["Country"] || "") + "</span></td>" +
          "<td>" + (b["Email"] || "") + "<br><span style='color:#7a6f65'>" + (b["Phone"] || "") + "</span></td>" +
          "<td>" + (b["Room"] || "") + "</td>" +
          "<td>" + (b["Check-in"] || "") + "</td>" +
          "<td>" + (b["Check-out"] || "") + "</td>" +
          "<td>" + (b["Nights"] || "") + "</td>" +
          "<td>ETB " + Number(b["Total"] || 0).toLocaleString() + "</td>" +
          "<td>" + (b["Requests"] || "-") + "</td>" +
          "<td>" + (b["Timestamp"] ? new Date(b["Timestamp"]).toLocaleString() : "") + "</td>";
        body.appendChild(tr);
      });
    } else {
      const filtered = allMessages.filter(m =>
        ((m["First Name"] || "") + " " + (m["Last Name"] || "")).toLowerCase().includes(query) ||
        (m["Email"] || "").toLowerCase().includes(query)
      );
      const body = document.getElementById("messagesBody");
      body.innerHTML = "";
      document.getElementById("empty").style.display = filtered.length ? "none" : "block";
      filtered.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><span class='badge'>New</span></td>" +
          "<td>" + (m["First Name"] || "") + " " + (m["Last Name"] || "") + "</td>" +
          "<td>" + (m["Email"] || "") + "<br><span style='color:#7a6f65'>" + (m["Phone"] || "") + "</span></td>" +
          "<td>" + (m["Subject"] || "") + "</td>" +
          "<td>" + (m["Message"] || "") + "</td>" +
          "<td>" + (m["Timestamp"] ? new Date(m["Timestamp"]).toLocaleString() : "") + "</td>";
        body.appendChild(tr);
      });
    }
  }

  document.getElementById("passwordInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });
</script>

</body>
</html>
